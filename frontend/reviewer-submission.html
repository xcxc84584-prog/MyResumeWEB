<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>履歷批閱</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <main class="resume-page">
        <section class="resume-owner-controls">
            <button type="button" onclick="window.location.href='/reviewer/dashboard'">← 返回批閱中心</button>
            <p>提交時間：<span id="submittedAt">—</span>　狀態：<strong id="submissionStatus">—</strong></p>
            <p id="snapshotNotice"></p>
        </section>
        <div id="resumeLoading" class="resume-status">
            履歷載入中...
        </div>

        <div id="resumeError" class="resume-status" hidden></div>

        <article id="resumeContent" class="resume-container" hidden>
            <header class="resume-header">
                <div class="resume-avatar-wrapper">
                    <img
                        id="resumeAvatar"
                        class="resume-avatar"
                        alt="個人頭像"
                        hidden
                    >
                    <div
                        id="resumeAvatarPlaceholder"
                        class="resume-avatar-placeholder"
                    >
                        Resume
                    </div>
                </div>

                <div class="resume-header-info">
                    <h1 id="resumeName">未設定姓名</h1>
                    <p id="resumeUsername"></p>
                    <p id="resumeEducation"></p>
                </div>
            </header>

            <section class="resume-section">
                <h2>基本資料</h2>

                <div id="profileGrid" class="resume-info-grid"></div>
            </section>

            <section class="resume-section">
                <h2>技能</h2>

                <div id="skillList" class="resume-list"></div>
            </section>

            <section class="resume-section">
                <h2>證照</h2>

                <div id="certificateList" class="resume-list"></div>
            </section>
        </article>
    </main>

    <script src="/static/js/resume-renderer.js"></script>
    <script src="/static/js/reviewer-submission.js"></script>
</body>
</html>
