<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>批閱帳號登入 | ResumeSystem</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <h1>ResumeSystem</h1>
        <p>批閱帳號登入</p>
    </header>

    <main>
        <form id="reviewerLoginForm">
            <div>
                <label for="companyName">公司名稱</label>
                <input
                    type="text"
                    id="companyName"
                    maxlength="200"
                    required
                >
            </div>

            <div>
                <label for="description">描述</label>
                <textarea
                    id="description"
                    maxlength="500"
                    rows="4"
                    required
                ></textarea>
            </div>

            <div>
                <label for="password">密碼</label>
                <input
                    type="password"
                    id="password"
                    minlength="8"
                    maxlength="128"
                    required
                    autocomplete="current-password"
                >
            </div>

            <button type="submit">登入批閱帳號</button>
        </form>

        <p id="message"></p>

        <p>
            <a href="/reviewer/register">建立批閱帳號</a>
        </p>

        <p>
            <a href="/reviewer">返回批閱模式</a>
        </p>
    </main>

    <script src="/static/js/reviewer-login.js"></script>
</body>
</html>
