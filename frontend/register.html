<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>建立帳號 | ResumeSystem</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <h1>ResumeSystem</h1>
        <p>建立帳號</p>
    </header>

    <main>
        <form id="registerForm">
            <div>
                <label for="username">帳號</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    minlength="3"
                    maxlength="50"
                    required
                >
            </div>

            <div>
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >
            </div>

            <div>
                <label for="password">密碼</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    minlength="8"
                    maxlength="128"
                    required
                >
            </div>

            <button type="submit">建立帳號</button>
        </form>

        <p id="message"></p>

        <p>
            <a href="/">返回首頁</a>
        </p>
    </main>

    <script src="/static/js/register.js"></script>
</body>
</html>
